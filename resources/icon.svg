<svg width="256" height="256" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Obsidian Armor Gradient -->
    <linearGradient id="obsidian_icon" x1="8" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2430" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <!-- Primary Cyber-Amber Flame Gradient -->
    <linearGradient id="flameMain_icon" x1="32" y1="6" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="30%" stop-color="#FF9E00" />
      <stop offset="75%" stop-color="#FF5400" />
      <stop offset="100%" stop-color="#B81D00" />
    </linearGradient>

    <!-- Darker Facet Shade for 3D Depth -->
    <linearGradient id="flameFacet_icon" x1="14" y1="16" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7B00" />
      <stop offset="100%" stop-color="#6B0F00" />
    </linearGradient>

    <!-- Cyan Singularity Spark -->
    <radialGradient id="cyanCore_icon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#70F8FF" />
      <stop offset="75%" stop-color="#00B4D8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0077B6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Hexagonal Obsidian Shield Base -->
  <polygon
    points="32,3 58,16 58,48 32,61 6,48 6,16"
    fill="url(#obsidian_icon)"
    stroke="#2B3340"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <polygon
    points="32,6.5 54.5,18 54.5,46 32,57.5 9.5,46 9.5,18"
    fill="none"
    stroke="url(#flameMain_icon)"
    stroke-width="1.4"
    stroke-opacity="0.85"
    stroke-linejoin="round"
  />

  <!-- 2. Outer Left & Right Faceted Flame Wings -->
  <polygon
    points="16,45 12,29 21,33 23,20 26,48"
    fill="url(#flameFacet_icon)"
    stroke="#07090E"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  <polygon
    points="48,45 52,29 43,33 41,20 38,48"
    fill="url(#flameFacet_icon)"
    stroke="#07090E"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- 3. Central Crown Flame Spire -->
  <polygon
    points="32,5 42,22 39,47 25,47 22,22"
    fill="url(#flameMain_icon)"
    stroke="#07090E"
    stroke-width="1.4"
    stroke-linejoin="round"
  />
  <polygon
    points="32,5 42,22 39,47 32,47"
    fill="#FF4800"
    fill-opacity="0.35"
  />

  <!-- 4. Interlocking Geometric 'A' Spear -->
  <path
    d="M32 16L46 47L38 54L32 49L26 54L18 47L32 16Z"
    fill="#0B0E14"
    stroke="url(#flameMain_icon)"
    stroke-width="2.4"
    stroke-linejoin="round"
  />

  <!-- Inner 'A' Crossbar & Obsidian Cutout -->
  <polygon
    points="32,23 39,40 24,45 22,41 34,36 32,30 27,40 23,40"
    fill="url(#flameMain_icon)"
  />

  <!-- 5. Cyan-White Energy Singularity Spark at Bottom Apex -->
  <circle cx="32" cy="51" r="7" fill="url(#cyanCore_icon)" />
  <polygon
    points="32,39 33.8,48.5 39,44 34.5,50.5 38,53 32,55.5 26,53 29.5,50.5 25,44 30.2,48.5"
    fill="#E0FBFC"
  />
  <circle cx="32" cy="51.5" r="2.2" fill="#FFFFFF" />
</svg>

