appId: com.flameagi.app
productName: FlameAGI
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
  # The window, tray and orb icons are loaded at runtime from
  # `out/main/../../resources`, so they must be inside the packaged app.
  # icon-reference.png is a design source file and is deliberately excluded.
  - resources/icon.png
  - resources/icon-pet.png
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
