name: Build & Release FlameAGI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build Windows Installer + Portable App
        run: |
          npm run typecheck
          npm run build:win

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/FlameAGI-Setup-*.exe
            release/FlameAGI-Portable-*.exe
            release/*.blockmap
            release/latest.yml

