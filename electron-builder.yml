appId: com.flameagi.app
productName: FlameAGI
directories:
  buildResources: resources
  output: release
asar: false
files:
  - out/**/*
  - package.json
  # Window, tray and orb icons are loaded at runtime from resources/
  - resources/icon.png
  - resources/icon.ico
  - resources/icon.svg
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/**/examples/**"
  - "!**/node_modules/**/*.{map,d.ts,d.ts.map,tsbuildinfo}"
extraResources:
  - from: chess_engine.py
    to: chess_engine.py
  - from: coder_engine.py
    to: coder_engine.py
  - from: .env.example
    to: .env.example
  - from: keys.example.json
    to: keys.example.json
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: FlameAGI-Setup-${version}.${ext}
portable:
  artifactName: FlameAGI-Portable-${version}.${ext}
